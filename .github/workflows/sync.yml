name: Sync WeRead Data

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  sync-data:
    runs-on: ubuntu-latest
    # 重点：显式赋予 GitHub Action 提交代码到仓库的写入权限
    permissions:
      contents: write

    steps:
      - name: 1. 拉取仓库代码
        uses: actions/checkout@v4

      - name: 2. 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 4. 执行微信读书数据抓取
        env:
          WEREAD_KEY: ${{ secrets.WEREAD_KEY }}
        run: |
          python scripts/sync_weread.py

      - name: 5. 提交并推送数据变更到仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add src/data/weread.json
          
          if git diff --staged --quiet; then
            echo "数据未发生变化，无需提交。"
          else
            git commit -m "chore: 自动化更新微信读书数据 [skip ci]"
            git push
          fi