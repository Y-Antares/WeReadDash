name: Sync WeRead Data

on:
  schedule:
    # 每天 UTC 时间 20:00 触发 (对应北京时间 04:00)
    - cron: '0 20 * * *'
  # 支持在 GitHub Actions 页面手动点击触发运行
  workflow_dispatch:

jobs:
  sync-data:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 拉取仓库代码
        uses: actions/checkout@v4

      - name: 2. 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 4. 执行微信读书数据抓取
        env:
          WEREAD_KEY: ${{ secrets.WEREAD_KEY }}
        run: |
          python scripts/sync_weread.py

      - name: 5. 提交并推送数据变更到仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add src/data/weread.json
          
          # 检查是否有数据变更，有变更才提交，防止产生空白提交错误
          if git diff --staged --quiet; then
            echo "数据未发生变化，无需提交。"
          else
            git commit -m "chore: 自动化更新微信读书数据 [skip ci]"
            git push
          fi